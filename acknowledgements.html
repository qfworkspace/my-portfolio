<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aknowledgements</title>
    <link rel="stylesheet" href="css/1-token.css">
    <link rel="stylesheet" href="css/2-global.css">
    <link rel="stylesheet" href="css/3-components.css">
    <link rel="stylesheet" href="css/4-header-footer.css">
    <link rel="stylesheet" href="css/5-layout.css">
    <link rel="stylesheet" href="css/6-errors.css">
</head>
<body class="wip-page">

    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Main Placeholder for Component Fetch -->
    <main class="wip-page__main" id="wip-placeholder"></main>

    <!-- Footer --
    <div id="footer-placeholder"></div> -->

    <!-- Component Loaders -->
    <script>
    fetch('components/header.html')
        .then(res => res.text())
        .then(data => document.getElementById('header-placeholder').innerHTML = data);

    fetch('components/under-construction.html')
        .then(res => res.text())
        .then(data => document.getElementById('wip-placeholder').innerHTML = data);

    fetch('components/footer.html')
        .then(res => res.text())
        .then(data => document.getElementById('footer-placeholder').innerHTML = data);
    </script>
</body>
</html>
